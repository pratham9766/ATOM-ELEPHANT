services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: elephant
      POSTGRES_USER: elephant
      POSTGRES_PASSWORD: elephant
    ports:
      - "5432:5432"
    volumes:
      - elephant_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elephant -d elephant"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  elephant_postgres:
